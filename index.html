<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. Santa Rosa - Plataforma Académica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variables de Entorno Visual de la Institución */
        :root {
            --rosa-principal: #e36b73;
            --rosa-hover: #d25a62;
            --texto-oscuro: #333333;
            --texto-mutado: #666666;
            --fondo-modal: rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        /* Estilos del Contenedor de la Alerta del Login */
        .error-message-box {
            display: none;
            background-color: #fce8e6;
            color: #a83232;
            border: 1px solid #f5c2c2;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        /* Estilos del Modal de Acceso Estilo Santa Rosa */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--fondo-modal);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-card {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
            position: relative;
            box-sizing: border-box;
        }

        .close-modal-btn {
            position: absolute;
            right: 20px;
            top: 16px;
            font-size: 20px;
            cursor: pointer;
            color: var(--texto-mutado);
            font-weight: bold;
            transition: color 0.2s ease;
        }

        .close-modal-btn:hover {
            color: var(--texto-oscuro);
        }

        .back-roles-link {
            display: block;
            margin-bottom: 20px;
            font-size: 14px;
            cursor: pointer;
            color: var(--rosa-principal);
            font-weight: 600;
            text-decoration: none;
        }

        .back-roles-link:hover {
            text-decoration: underline;
        }

        .modal-header-icon {
            text-align: center;
            margin-bottom: 10px;
            color: var(--rosa-principal);
            font-size: 2.5em;
        }

        .modal-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--texto-oscuro);
            margin: 0 0 5px 0;
        }

        .modal-subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--texto-mutado);
            margin: 0 0 25px 0;
        }

        /* Formulario e Inputs de Texto */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--texto-oscuro);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 15px;
            color: var(--texto-oscuro);
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--rosa-principal);
        }

        /* Botón de Envío */
        .btn-submit-login {
            width: 100%;
            padding: 14px;
            background-color: var(--rosa-principal);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit-login:hover {
            background-color: var(--rosa-hover);
        }

        .btn-submit-login:disabled {
            background-color: #e0a3a7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="loginModal" class="modal-backdrop">
        <div class="modal-card">
            
            <span class="close-modal-btn">&times;</span>
            <span class="back-roles-link" id="btnBackToRoles"><i class="fa-solid fa-arrow-left"></i> Volver</span>

            <div class="modal-header-icon">
                <i class="fa-solid fa-screwdriver-wrench" id="headerIcon"></i>
            </div>
            <h3 class="modal-title" id="modalMainTitle">Acceso para Soporte</h3>
            <p class="modal-subtitle">I.E. Santa Rosa - Huarmey</p>

            <div id="loginError" class="error-message-box"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="ejemplo@iesantarosa.edu.pe" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••••••••••" required>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit-login">Ingresar a la Plataforma</button>
            </form>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Configuración oficial de tu proyecto: Plataforma-SR
        const firebaseConfig = {
            apiKey: "AIzaSyAnPKfXtH6FNR5dKNBTkFbetie15R6ktZ0",
            authDomain: "plataforma-sr.firebaseapp.com",
            projectId: "plataforma-sr",
            storageBucket: "plataforma-sr.appspot.com",
            messagingSenderId: "930820349624",
            appId: "1:930820349624:web:26a5e3b338f661ed645e4d",
            measurementId: "G-VTJN5HBVVY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const btnSubmit = document.getElementById('submitBtn');
            
            errorDiv.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Autenticando usuario...';

            // 1. Autenticar en Firebase Auth
            signInWithEmailAndPassword(auth, email, password)
                .then(async (userCredential) => {
                    const user = userCredential.user;

                    try {
                        // 2. Obtener el documento del usuario usando su UID exacto
                        const userDocRef = doc(db, "usuarios", user.uid);
                        const userDocSnap = await getDoc(userDocRef);

                        if (userDocSnap.exists()) {
                            const userData = userDocSnap.data();
                            
                            const nombreUsuario = userData.nombre || "Usuario"; 
                            const rolUsuario = userData.rol || "Invitado"; 

                            // 3. Almacenar datos de sesión en LocalStorage
                            localStorage.setItem('session_user_name', nombreUsuario);
                            localStorage.setItem('session_user_role', rolUsuario);

                            // 4. Enrutamiento según el rol de la base de datos
                            if (rolUsuario === 'Estudiante') {
                                window.location.href = 'SantaRosa/primaria.html';
                            } else if (rolUsuario === 'Docente') {
                                window.location.href = 'SantaRosa/secundaria.html';
                            } else if (rolUsuario === 'Director' || rolUsuario === 'Directora') {
                                window.location.href = 'SantaRosa/documentos.html';
                            } else if (rolUsuario === 'Soporte TI') {
                                window.location.href = 'SantaRosa/soporte.html';
                            } else {
                                window.location.href = 'index.html';
                            }

                        } else {
                            errorDiv.style.display = 'block';
                            errorDiv.textContent = 'Su cuenta no tiene un perfil asignado en Cloud Firestore.';
                            btnSubmit.disabled = false;
                            btnSubmit.textContent = 'Ingresar a la Plataforma';
                        }
                    } catch (dbError) {
                        console.error("Fallo al leer Firestore:", dbError);
                        errorDiv.style.display = 'block';
                        errorDiv.textContent = 'Error de permisos o conexión al verificar el rol.';
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Ingresar a la Plataforma';
                    }
                })
                .catch((error) => {
                    console.error("Código de error de Auth:", error.code);
                    errorDiv.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Ingresar a la Plataforma';
                    
                    if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                        errorDiv.textContent = 'El correo electrónico o la contraseña son incorrectos.';
                    } else if (error.code === 'auth/invalid-email') {
                        errorDiv.textContent = 'El formato del correo electrónico no es válido.';
                    } else {
                        errorDiv.textContent = 'Ocurrió un problema al intentar iniciar sesión. Inténtelo más tarde.';
                    }
                });
        });
    </script>
</body>
</html>
